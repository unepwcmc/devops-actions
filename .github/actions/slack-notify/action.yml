name: 'Slack Notify'
description: 'Send deployment notifications to Slack with customizable messages and formatting'
author: 'WCMC DevOps Team'

inputs:
  slack-bot-token:
    description: 'Slack bot token for authentication'
    required: true
  slack-channel-id:
    description: 'Slack channel ID to send notifications to'
    required: true
  notification-type:
    description: 'Type of notification: started, success, failure, custom'
    required: true
    default: 'started'
  action-type:
    description: 'Type of action: deploy, setup, provision, test'
    required: true
    default: 'deploy'
  environment:
    description: 'Environment being deployed to (staging, production)'
    required: true
  repository:
    description: 'Repository name'
    required: true
  repository-url:
    description: 'Repository URL'
    required: true
  action-run-url:
    description: 'GitHub Action run URL'
    required: true
  actor:
    description: 'GitHub actor who triggered the action'
    required: true
  actor-url:
    description: 'GitHub actor profile URL'
    required: true
  workflow-name:
    description: 'Name of the workflow'
    required: true
  run-id:
    description: 'GitHub run ID'
    required: true
  commit-message:
    description: 'Commit message that triggered the deployment'
    required: false
    default: 'No commit message available'
  runner-name:
    description: 'Name of the runner executing the job'
    required: false
    default: 'GitHub Runner'
  start-time:
    description: 'Start time of the action (for started notifications)'
    required: false
  end-time:
    description: 'End time of the action (for success/failure notifications)'
    required: false
  failure-reason:
    description: 'Reason for failure (for failure notifications)'
    required: false
    default: 'GitHub Action failed - check logs for details'
  update-ts:
    description: 'Timestamp to update an existing message'
    required: false
  update-message-ts:
    description: 'Alias for update-ts - timestamp to update an existing message'
    required: false
  custom-message:
    description: 'Custom message for custom notification type'
    required: false
  error-message:
    description: 'Error message for failure notifications'
    required: false
  deployment-duration:
    description: 'Duration of the deployment in seconds'
    required: false
  kamal-version:
    description: 'Kamal version being used'
    required: false

outputs:
  message-ts:
    description: 'Timestamp of the sent message for future updates'
    value: ${{ steps.slack-notification.outputs.ts }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        # Inputs are passed through the environment, never interpolated into the
        # script body: `${{ }}` is expanded as text before bash parses the script,
        # so any input reaching a run: block directly is a command injection sink.
        NOTIFICATION_TYPE: ${{ inputs.notification-type }}
        ACTION_TYPE: ${{ inputs.action-type }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ ! "$NOTIFICATION_TYPE" =~ ^(started|success|failure|custom)$ ]]; then
          echo "Error: notification-type must be one of: started, success, failure, custom"
          exit 1
        fi

        # Convert action-type to lowercase for validation
        action_type_lower=$(echo "$ACTION_TYPE" | tr '[:upper:]' '[:lower:]')
        if [[ ! "$action_type_lower" =~ ^(deploy|setup|provision|test)$ ]]; then
          echo "Error: action-type must be one of: deploy, setup, provision, test (case insensitive)"
          echo "Received: $ACTION_TYPE"
          exit 1
        fi

        if [[ ! "$ENVIRONMENT" =~ ^(staging|production)$ ]]; then
          echo "Error: environment must be either staging or production"
          exit 1
        fi

    - name: Set default values for empty variables
      shell: bash
      run: |
        # Write NAME=VALUE to $GITHUB_ENV with any CR/LF stripped. A value carrying a
        # newline would otherwise start a second NAME=VALUE line and let the caller
        # define arbitrary environment variables for every later step.
        write_env() {
          printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr -d '\r\n')" >> "$GITHUB_ENV"
        }

        # Set default values for empty environment variables to prevent JSON parsing errors
        write_env START_TIME "${START_TIME:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}"
        write_env END_TIME "${END_TIME:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}"
        write_env DEPLOYMENT_DURATION "${DEPLOYMENT_DURATION:-'N/A'}"
        write_env KAMAL_VERSION "${KAMAL_VERSION:-'N/A'}"
        write_env CUSTOM_MESSAGE "${CUSTOM_MESSAGE:-''}"

        # Format ACTION_TYPE for better display (capitalize first letter)
        action_type="$ACTION_TYPE_INPUT"
        formatted_action_type="$(echo "${action_type:0:1}" | tr '[:lower:]' '[:upper:]')${action_type:1}"
        write_env ACTION_TYPE "$formatted_action_type"

        # Improve FAILURE_REASON if it's just 'failure'
        failure_reason="$FAILURE_REASON_INPUT"
        if [[ "$failure_reason" == "failure" ]]; then
          failure_reason="GitHub Action failed - check logs for details"
        fi
        write_env FAILURE_REASON "$failure_reason"
      env:
        START_TIME: ${{ inputs.start-time }}
        END_TIME: ${{ inputs.end-time }}
        DEPLOYMENT_DURATION: ${{ inputs.deployment-duration }}
        KAMAL_VERSION: ${{ inputs.kamal-version }}
        CUSTOM_MESSAGE: ${{ inputs.custom-message }}
        ACTION_TYPE_INPUT: ${{ inputs.action-type }}
        FAILURE_REASON_INPUT: ${{ inputs.failure-reason }}

    - name: Sanitize values for JSON
      shell: bash
      env:
        # commit-message is the highest-risk input: callers wire it to
        # github.event.head_commit.message / github.event.release.name, both of
        # which are attacker-controlled by anyone able to push a branch or cut a
        # release. It must never be interpolated into the script body.
        COMMIT_MESSAGE_INPUT: ${{ inputs.commit-message }}
      run: |
        # Use jq to JSON-escape values, then strip the surrounding quotes so they can be embedded in templates
        escape_for_template() {
          local value="$1"
          local escaped
          escaped=$(printf '%s' "$value" | jq -Rsa .)
          # Remove leading and trailing quotes from jq output
          echo "${escaped:1:${#escaped}-2}"
        }

        # jq -Rsa emits a single line (literal newlines become \n), so these are
        # already safe to write as one NAME=VALUE pair.
        escaped_commit_message=$(escape_for_template "$COMMIT_MESSAGE_INPUT")
        printf 'COMMIT_MESSAGE=%s\n' "$escaped_commit_message" >> "$GITHUB_ENV"

        escaped_failure_reason=$(escape_for_template "${FAILURE_REASON}")
        printf 'FAILURE_REASON=%s\n' "$escaped_failure_reason" >> "$GITHUB_ENV"

    - name: Set notification template
      id: template
      shell: bash
      env:
        NOTIFICATION_TYPE: ${{ inputs.notification-type }}
      run: |
        # Every branch writes a literal filename. This output is consumed as
        # payload-file-path, so a caller-controlled value here would be a path
        # traversal sink as well as a shell injection one.
        case "$NOTIFICATION_TYPE" in
          "started")
            echo "template=github-deploy-slack-started.json" >> $GITHUB_OUTPUT
            ;;
          "success")
            echo "template=github-deploy-slack-success.json" >> $GITHUB_OUTPUT
            ;;
          "failure")
            echo "template=github-deploy-slack-failure.json" >> $GITHUB_OUTPUT
            ;;
          "custom")
            echo "template=github-slack-custom.json" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Build Slack payload
      id: payload
      shell: bash
      env:
        TEMPLATE_DIR: ${{ github.action_path }}/templates
        TEMPLATE_NAME: ${{ steps.template.outputs.template }}
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
        UPDATE_TS: ${{ inputs.update-ts || inputs.update-message-ts }}
      run: |
        set -euo pipefail

        template="${TEMPLATE_DIR}/${TEMPLATE_NAME}"
        if [ ! -f "${template}" ]; then
          echo "::error::Slack payload template not found: ${TEMPLATE_NAME}"
          exit 1
        fi

        # slack-github-action v2 dropped the channel-id and update-ts inputs.
        # Both now travel inside the payload, and the method chooses between
        # posting a new message and updating an existing one.
        payload="${RUNNER_TEMP}/slack-payload-${TEMPLATE_NAME}"
        if [ -n "${UPDATE_TS}" ]; then
          jq --arg channel "${SLACK_CHANNEL_ID}" --arg ts "${UPDATE_TS}" \
             '. + {channel: $channel, ts: $ts}' "${template}" > "${payload}"
          echo "method=chat.update" >> "$GITHUB_OUTPUT"
        else
          jq --arg channel "${SLACK_CHANNEL_ID}" \
             '. + {channel: $channel}' "${template}" > "${payload}"
          echo "method=chat.postMessage" >> "$GITHUB_OUTPUT"
        fi
        echo "path=${payload}" >> "$GITHUB_OUTPUT"

    - name: Send Slack notification
      id: slack-notification
      uses: slackapi/slack-github-action@v4
      with:
        method: ${{ steps.payload.outputs.method }}
        token: ${{ inputs.slack-bot-token }}
        payload-file-path: ${{ steps.payload.outputs.path }}
        payload-templated: true
      env:
        REPOSITORY: ${{ inputs.repository }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        RUNNER_NAME: ${{ inputs.runner-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        START_TIME: ${{ inputs.start-time }}
        END_TIME: ${{ inputs.end-time }}
        ACTION_RUN_URL: ${{ inputs.action-run-url }}
        ACTOR: ${{ inputs.actor }}
        ACTOR_URL: ${{ inputs.actor-url }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        RUN_ID: ${{ inputs.run-id }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
        DEPLOYMENT_DURATION: ${{ inputs.deployment-duration }}
        KAMAL_VERSION: ${{ inputs.kamal-version }}
        CUSTOM_MESSAGE: ${{ inputs.custom-message }}

branding:
  icon: 'message-circle'
  color: 'blue'
