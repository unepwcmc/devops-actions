name: 'UNBL Backend v1 Deploy (From unbl-infrastructure repo)'
description: 'Deploy UNBL services - provisions infrastructure if needed, then deploys code'
author: 'WCMC DevOps Team'

inputs:
  environment:
    description: 'Deployment environment (staging, production)'
    required: true
  azure-credentials:
    description: 'Azure service principal credentials (JSON)'
    required: true
  infrastructure-ref:
    description: 'Branch/tag to checkout from unbl-infrastructure'
    required: false
    default: 'remove-stac-titiler'
  services-ref:
    description: 'Branch/tag to checkout from unbl-services'
    required: false
    default: 'new-staging-deploy'
  run-tests:
    description: 'Run unit tests before deployment'
    required: false
    default: 'true'
  postgres-admin-password:
    description: 'PostgreSQL admin password (required for infrastructure provisioning)'
    required: true

outputs:
  deployment-status:
    description: 'Status of the deployment operation'
    value: ${{ steps.deploy-result.outputs.status }}
  deployment-duration:
    description: 'Duration of the deployment operation in seconds'
    value: ${{ steps.deploy-result.outputs.duration }}
  deployment-url:
    description: 'URL of the deployed application'
    value: ${{ steps.deploy-result.outputs.url }}
  image-tag:
    description: 'Docker image tag deployed'
    value: ${{ steps.deploy.outputs.image_tag }}

runs:
  using: 'composite'
  steps:
    - name: Start timing
      id: start
      shell: bash
      run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Checkout services repo
      uses: actions/checkout@v4
      with:
        repository: unepwcmc/unbl-services
        ref: ${{ inputs.services-ref }}
        path: ./unbl-services
        token: ${{ env.GH_TOKEN }}

    - name: Checkout infrastructure repo
      uses: actions/checkout@v4
      with:
        repository: unepwcmc/unbl-infrastructure
        ref: ${{ inputs.infrastructure-ref }}
        path: ./unbl-infrastructure
        token: ${{ env.GH_TOKEN }}

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ inputs.azure-credentials }}

    - name: Provision infrastructure
      shell: bash
      working-directory: ./unbl-infrastructure/azure
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_POSTGRES_ADMIN_PASSWORD: ${{ inputs.postgres-admin-password }}
      run: |
        RG="unbl-${IN_ENVIRONMENT}-rg"
        ENV="${IN_ENVIRONMENT}"

        echo "🏗️ Provisioning services infrastructure..."
        
        # Create .env file with required secrets.
        # Built with printf from the environment rather than a heredoc: workflow
        # expressions are substituted as text before bash runs, so a value
        # containing a line reading EOF would close the heredoc early and the
        # remainder of this block would be executed as shell.
        {
          printf 'POSTGRES_ADMIN_PASSWORD=%s\n' "${IN_POSTGRES_ADMIN_PASSWORD}"
          printf 'MONGO_ADMIN_PASSWORD=%s\n' "${MONGO_ADMIN_PASSWORD}"
          printf 'AUTH0_CLIENT_ID=%s\n' "${AUTH0_CLIENT_ID}"
          printf 'AUTH0_CLIENT_SECRET=%s\n' "${AUTH0_CLIENT_SECRET}"
          printf 'AUTH0_APPLICATION_CLIENT_ID=%s\n' "${AUTH0_APPLICATION_CLIENT_ID}"
          printf 'AUTH0_EXTENSION_URL=%s\n' "${AUTH0_EXTENSION_URL}"
          printf 'SERVICE_API_KEY=%s\n' "${SERVICE_API_KEY}"
          printf 'SERVICE_API_READ_KEY=%s\n' "${SERVICE_API_READ_KEY}"
          printf 'GATSBY_MAPBOX_TOKEN=%s\n' "${GATSBY_MAPBOX_TOKEN}"
        } > .env
        
        source .env
        
        # Deploy infrastructure using Bicep
        # The Bicep deployment is idempotent - safe to run multiple times
        ./scripts/deploy.sh --yes --skip-validation
        
        # Populate Key Vault secrets
        ./scripts/populate-secrets.sh
        
        echo "✅ Infrastructure provisioned"

    - name: Run unit tests
      if: inputs.run-tests == 'true'
      shell: bash
      working-directory: ./unbl-services
      run: |
        echo "Running unit tests..."
        docker run --rm \
          -v $(pwd):/workspace \
          -w /workspace \
          --platform linux/amd64 \
          node:18.20.4-bullseye-slim \
          sh -c 'npm ci && npm run test:unit'
        echo "✅ Unit tests passed"

    - name: Deploy services 
      id: deploy
      shell: bash
      working-directory: ./unbl-infrastructure/azure
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        RG="unbl-${IN_ENVIRONMENT}-rg"
        
        echo "Deploying services using deploy-backend.sh..."
        echo "  Resource Group: $RG"
        
        # The deploy-backend.sh script handles:
        # - Finding ACR and services repo
        # - Building Docker image (ACR Tasks)
        # - Configuring App Services
        # - Restarting services
        # - Waiting for initialization
        # - Printing API and TiTiler URLs
        ./scripts/deploy-backend.sh --resource-group "$RG"
        
        echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Run health checks
      shell: bash
      working-directory: ./unbl-infrastructure/azure
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        RG="unbl-${IN_ENVIRONMENT}-rg"
        ENV="${IN_ENVIRONMENT}"
        
        echo "Running health checks..."
        ./scripts/health-check.sh --resource-group "$RG" --environment "$ENV" || {
          echo "⚠️ Some health checks failed"
          echo "Services may need more time to initialize"
        }

    - name: Set deployment result
      id: deploy-result
      shell: bash
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - ${{ steps.start.outputs.start_time }}))
        API_URL="https://unbl-${IN_ENVIRONMENT}-api.azurewebsites.net"
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "duration=$DURATION" >> $GITHUB_OUTPUT
        echo "url=$API_URL" >> $GITHUB_OUTPUT
        
        echo "✅ Deployment complete!"
        echo "   Duration: ${DURATION}s"
        echo "   API URL: $API_URL"
