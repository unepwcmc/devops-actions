name: 'Kamal v1 Deploy'
description: 'Deploy Rails applications using Kamal v1 with comprehensive configuration and best practices'
author: 'WCMC DevOps Team'

inputs:
  environment:
    description: 'Environment to deploy to (staging, production)'
    required: true
  kamal-version:
    description: 'Kamal version to use'
    required: false
    default: '1.4.0'
  ruby-version:
    description: 'Ruby version to use'
    required: false
    default: '3.2.0'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.3.0'
  buildx-version:
    description: 'Docker Buildx version to use'
    required: false
    default: 'v0.17.1'
  working-directory:
    description: 'Working directory for Rails application'
    required: false
    default: '.'
  dockerfile-path:
    description: 'Path to Dockerfile relative to working directory'
    required: false
    default: 'Dockerfile'
  kamal-config-path:
    description: 'Path to Kamal config file relative to working directory'
    required: false
    default: 'config/deploy.yml'
  database-port:
    description: 'Database port'
    required: false
    default: '5432'
  # Redis Configuration defaults
  redis-host:
    description: 'Redis host'
    required: false
    default: 'host.docker.internal'
  redis-port:
    description: 'Redis port'
    required: false
    default: '6379'
  redis-database:
    description: 'Redis database number for Sidekiq'
    required: false
    default: '1'
  # Project-specific Database Naming
  database-env-prefix:
    description: 'Database environment variable prefix (e.g., OCEAN_CENSUS, TARGET_TRACKER)'
    required: false
    default: 'TARGET_TRACKER'
  # Deployment options
  deployment-strategy:
    description: 'Deployment strategy (rolling, blue-green, immediate)'
    required: false
    default: 'rolling'
  health-check-enabled:
    description: 'Enable health checks during deployment'
    required: false
    default: 'true'
  rollback-on-failure:
    description: 'Enable automatic rollback on deployment failure'
    required: false
    default: 'true'
  maintenance-mode:
    description: 'Enable maintenance mode during deployment'
    required: false
    default: 'false'
  # Generic Additional Secrets
  additional-secrets:
    description: 'Additional secrets in KEY=VALUE format, one per line'
    required: false
  pre-deploy-commands:
    description: 'Additional commands to run before deployment'
    required: false
  post-deploy-commands:
    description: 'Additional commands to run after successful deployment'
    required: false

outputs:
  deployment-status:
    description: 'Status of the deployment operation'
    value: ${{ steps.deploy-result.outputs.status }}
  deployment-duration:
    description: 'Duration of the deployment operation in seconds'
    value: ${{ steps.deploy-result.outputs.duration }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        IN_DEPLOYMENT_STRATEGY: ${{ inputs.deployment-strategy }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        echo "🔍 Validating deployment inputs for Kamal v1..."

        # Validate environment
        if [[ ! "${IN_ENVIRONMENT}" =~ ^(staging|production)$ ]]; then
          echo "❌ Error: environment must be either 'staging' or 'production'"
          exit 1
        fi

        # Validate deployment strategy
        if [[ ! "${IN_DEPLOYMENT_STRATEGY}" =~ ^(rolling|blue-green|immediate)$ ]]; then
          echo "❌ Error: deployment-strategy must be one of: rolling, blue-green, immediate"
          exit 1
        fi

        # Validate working directory exists
        if [[ ! -d "${IN_WORKING_DIRECTORY}" ]]; then
          echo "❌ Error: working-directory '${IN_WORKING_DIRECTORY}' does not exist"
          exit 1
        fi

        echo "✅ Input validation completed for Kamal v1 deployment"

    - name: Validate required environment variables
      shell: bash
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "🔧 Validating required environment variables for Kamal v1 deployment..."
        
        var_names=(
          "SSH_PRIVATE_KEY"
          "KAMAL_REGISTRY_USERNAME"
          "KAMAL_REGISTRY_PASSWORD"
          "RAILS_MASTER_KEY"
          "RAILS_DEFAULT_PUBLIC_APP_HOST"
          "RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL"
          "DATABASE_HOST"
          "DATABASE_NAME"
          "DATABASE_USERNAME"
          "DATABASE_PASSWORD"
        )

        for var_name in "${var_names[@]}"; do
          if [[ -z "${!var_name}" ]]; then
            echo "❌ Error: ${var_name} is not set or empty"
            echo "Please add this secret to your GitHub environment (${IN_ENVIRONMENT})"
            exit 1
          else
            echo "✅ ${var_name} is set"
          fi
        done

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - name: Install PostgreSQL Client Libraries
      shell: bash
      run: |
        echo "🐘 Installing PostgreSQL client libraries..."
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Kamal v1
      shell: bash
      env:
        IN_KAMAL_VERSION: ${{ inputs.kamal-version }}
      run: |
        echo "🚢 Installing Kamal v${IN_KAMAL_VERSION} (Legacy v1)..."
        gem install kamal -v "${IN_KAMAL_VERSION}"
        kamal version

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true
        version: v0.17.1

    - name: Configure Buildx
      shell: bash
      run: |
        echo "🐳 Configuring Docker Buildx for Kamal v1..."
        if ! docker buildx version; then
          echo "❌ Error: Buildx not installed correctly"
          exit 1
        fi

        docker buildx create --name kamal-v1-deploy-builder --driver docker-container --use 2>/dev/null || docker buildx use kamal-v1-deploy-builder
        docker buildx inspect --bootstrap
        echo "✅ Buildx configured successfully for v1"

    - name: Create Kamal v1 secrets file
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ADDITIONAL_SECRETS: ${{ inputs.additional-secrets }}
        IN_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        IN_AWS_REGION: ${{ inputs.aws-region }}
        IN_AWS_S3_ACCESS_KEY_ID: ${{ inputs.aws-s3-access-key-id }}
        IN_AWS_S3_BUCKET_NAME: ${{ inputs.aws-s3-bucket-name }}
        IN_AWS_S3_REGION: ${{ inputs.aws-s3-region }}
        IN_AWS_S3_SECRET_ACCESS_KEY: ${{ inputs.aws-s3-secret-access-key }}
        IN_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        IN_AZURE_AD_CLIENT_ID: ${{ inputs.azure-ad-client-id }}
        IN_AZURE_AD_CLIENT_SECRET: ${{ inputs.azure-ad-client-secret }}
        IN_AZURE_AD_TENANT_ID: ${{ inputs.azure-ad-tenant-id }}
        IN_DATABASE_ENV_PREFIX: ${{ inputs.database-env-prefix }}
        IN_DATABASE_HOST: ${{ inputs.database-host }}
        IN_DATABASE_NAME: ${{ inputs.database-name }}
        IN_DATABASE_PASSWORD: ${{ inputs.database-password }}
        IN_DATABASE_PORT: ${{ inputs.database-port }}
        IN_DATABASE_USERNAME: ${{ inputs.database-username }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_FRONTEND_APP_NAME: ${{ inputs.frontend-app-name }}
        IN_KAMAL_REGISTRY_PASSWORD: ${{ inputs.kamal-registry-password }}
        IN_KAMAL_REGISTRY_USERNAME: ${{ inputs.kamal-registry-username }}
        IN_MAIL_PASSWORD: ${{ inputs.mail-password }}
        IN_MAIL_USERNAME: ${{ inputs.mail-username }}
        IN_RAILS_MASTER_KEY: ${{ inputs.rails-master-key }}
        IN_REDIS_DATABASE: ${{ inputs.redis-database }}
        IN_REDIS_HOST: ${{ inputs.redis-host }}
        IN_REDIS_PASSWORD: ${{ inputs.redis-password }}
        IN_REDIS_PORT: ${{ inputs.redis-port }}
        IN_REDIS_USERNAME: ${{ inputs.redis-username }}
        IN_WCMC_USER_MANAGEMENT_SECRET: ${{ inputs.wcmc-user-management-secret }}
      run: |
        echo "🔐 Creating Kamal v1 secrets file..."
        mkdir -p .kamal
        secrets_file=".kamal/secrets.${IN_ENVIRONMENT}"

        # Create secrets file with proper permissions
        touch "$secrets_file"
        chmod 600 "$secrets_file"

        # Base secrets (v1 format)
        cat <<EOF > "$secrets_file"
        KAMAL_REGISTRY_USERNAME=${IN_KAMAL_REGISTRY_USERNAME}
        KAMAL_REGISTRY_PASSWORD=${IN_KAMAL_REGISTRY_PASSWORD}
        RAILS_MASTER_KEY=${IN_RAILS_MASTER_KEY}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_HOSTNAME=${IN_DATABASE_HOST}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_NAME=${IN_DATABASE_NAME}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_USERNAME=${IN_DATABASE_USERNAME}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_PASSWORD=${IN_DATABASE_PASSWORD}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_PORT=${IN_DATABASE_PORT}
        EOF

        # Add Redis configuration if provided
        if [[ -n "${IN_REDIS_USERNAME}" && -n "${IN_REDIS_PASSWORD}" ]]; then
          echo "REDIS_USERNAME=${IN_REDIS_USERNAME}" >> "$secrets_file"
          echo "REDIS_PASSWORD=${IN_REDIS_PASSWORD}" >> "$secrets_file"
          echo "SIDEKIQ_REDIS_URL=redis://${IN_REDIS_USERNAME}:${IN_REDIS_PASSWORD}@${IN_REDIS_HOST}:${IN_REDIS_PORT}/${IN_REDIS_DATABASE}" >> "$secrets_file"
          echo "✅ Added Redis configuration with Sidekiq URL"
        fi

        # Add Mail configuration if provided
        if [[ -n "${IN_MAIL_USERNAME}" && -n "${IN_MAIL_PASSWORD}" ]]; then
          echo "MAIL_USERNAME=${IN_MAIL_USERNAME}" >> "$secrets_file"
          echo "MAIL_PASSWORD=${IN_MAIL_PASSWORD}" >> "$secrets_file"
          echo "✅ Added Mail server configuration"
        fi

        # Add AWS general secrets if provided
        if [[ -n "${IN_AWS_ACCESS_KEY_ID}" ]]; then
          echo "AWS_ACCESS_KEY_ID=${IN_AWS_ACCESS_KEY_ID}" >> "$secrets_file"
          echo "AWS_SECRET_ACCESS_KEY=${IN_AWS_SECRET_ACCESS_KEY}" >> "$secrets_file"
          echo "AWS_REGION=${IN_AWS_REGION}" >> "$secrets_file"
          echo "✅ Added AWS general configuration"
        fi

        # Add AWS S3 specific secrets if provided
        if [[ -n "${IN_AWS_S3_ACCESS_KEY_ID}" ]]; then
          echo "AWS_S3_ACCESS_KEY_ID=${IN_AWS_S3_ACCESS_KEY_ID}" >> "$secrets_file"
          echo "AWS_S3_SECRET_ACCESS_KEY=${IN_AWS_S3_SECRET_ACCESS_KEY}" >> "$secrets_file"
          echo "AWS_S3_REGION=${IN_AWS_S3_REGION}" >> "$secrets_file"
          echo "AWS_S3_NAME=${IN_AWS_S3_BUCKET_NAME}" >> "$secrets_file"
          echo "✅ Added AWS S3 configuration"
        fi

        # Add Frontend Integration if provided
        if [[ -n "${IN_FRONTEND_APP_NAME}" ]]; then
          echo "FRONTEND_APP_NAME=${IN_FRONTEND_APP_NAME}" >> "$secrets_file"
          echo "✅ Added Frontend integration configuration"
        fi

        # Add Azure AD configuration if provided
        if [[ -n "${IN_AZURE_AD_CLIENT_ID}" ]]; then
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_CLIENT_ID=${IN_AZURE_AD_CLIENT_ID}" >> "$secrets_file"
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_CLIENT_SECRET=${IN_AZURE_AD_CLIENT_SECRET}" >> "$secrets_file"
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_TENANT_ID=${IN_AZURE_AD_TENANT_ID}" >> "$secrets_file"
          echo "✅ Added Azure AD configuration for WCMC User Management"
        fi

        # Add WCMC User Management configuration if provided
        if [[ -n "${IN_WCMC_USER_MANAGEMENT_SECRET}" ]]; then
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_SECRET=${IN_WCMC_USER_MANAGEMENT_SECRET}" >> "$secrets_file"
          echo "✅ Added WCMC User Management configuration"
        fi

        # Add additional secrets if provided
        if [[ -n "${IN_ADDITIONAL_SECRETS}" ]]; then
          echo "" >> "$secrets_file"
          echo "# Additional project-specific secrets" >> "$secrets_file"
          echo "${IN_ADDITIONAL_SECRETS}" >> "$secrets_file"
          echo "✅ Added additional project-specific secrets"
        fi

        echo "✅ Kamal v1 secrets file created"

    - name: Get current deployment info
      id: current-deployment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "📋 Getting current deployment information..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Get current version/container info for potential rollback (v1 syntax)
        if kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}" 2>/dev/null; then
          current_containers=$(kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}" 2>/dev/null | grep -v "CONTAINER" | head -1 | awk '{print $2}' || echo "none")
          echo "current-version=${current_containers}" >> $GITHUB_OUTPUT
          echo "ℹ️ Current running containers: ${current_containers}"
        else
          echo "current-version=none" >> $GITHUB_OUTPUT
          echo "ℹ️ No current deployment found"
        fi

    - name: Enable maintenance mode
      if: inputs.enable-maintenance-mode == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "🚧 Enabling maintenance mode for Kamal v1..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Create a simple maintenance page if it doesn't exist
        if [[ ! -f "public/maintenance.html" ]]; then
          mkdir -p public
          cat <<EOF > public/maintenance.html
        <!DOCTYPE html>
        <html>
        <head>
          <title>Maintenance</title>
          <style>body { font-family: Arial; text-align: center; padding: 50px; }</style>
        </head>
        <body>
          <h1>🔧 Maintenance in Progress</h1>
          <p>We're updating the application. Please check back in a few minutes.</p>
        </body>
        </html>
        EOF
        fi

        echo "✅ Maintenance mode enabled"

    - name: Run pre-deploy commands
      if: inputs.pre-deploy-commands != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_PRE_DEPLOY_COMMANDS: ${{ inputs.pre-deploy-commands }}
      run: |
        echo "🔧 Running pre-deploy commands..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)
        "${IN_PRE_DEPLOY_COMMANDS}"

    - name: Deploy with Kamal v1
      id: kamal-deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🚀 Starting Kamal v1 deployment to ${IN_ENVIRONMENT}..."
        start_time=$(date +%s)

        # Load secrets
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Set deployment flags (v1 syntax)
        deploy_flags="--verbose -c ${IN_KAMAL_CONFIG_PATH} -d ${IN_ENVIRONMENT}"

        # Run deployment (v1 syntax may differ slightly)
        if kamal deploy $deploy_flags; then
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          # Get deployed version (v1 may have different output format)
          deployed_version=$(kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}" 2>/dev/null | grep -v "CONTAINER" | head -1 | awk '{print $2}' || echo "unknown")

          echo "deploy-duration=${duration}" >> $GITHUB_OUTPUT
          echo "deploy-status=success" >> $GITHUB_OUTPUT
          echo "deployed-version=${deployed_version}" >> $GITHUB_OUTPUT
          echo "rollback-performed=false" >> $GITHUB_OUTPUT
          echo "✅ Kamal v1 deployment completed successfully in ${duration} seconds"
          echo "🏷️ Deployed version: ${deployed_version}"
        else
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "deploy-duration=${duration}" >> $GITHUB_OUTPUT
          echo "deploy-status=failed" >> $GITHUB_OUTPUT
          echo "deployed-version=none" >> $GITHUB_OUTPUT
          echo "❌ Kamal v1 deployment failed after ${duration} seconds"
          exit 1
        fi

    - name: Wait for deployment to stabilize
      shell: bash
      run: |
        echo "⏳ Waiting for deployment to stabilize..."
        sleep 30

    - name: Run health checks
      id: health-checks
      if: inputs.enable-health-checks == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_HEALTH_CHECK_TIMEOUT: ${{ inputs.health-check-timeout }}
        IN_HEALTH_CHECK_URL: ${{ inputs.health-check-url }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🏥 Running comprehensive health checks for Kamal v1..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Check container status (v1 syntax)
        echo "📊 Checking container status..."
        if ! kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}"; then
          echo "❌ Container health check failed"
          echo "health-status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Check application health endpoint if provided
        if [[ -n "${IN_HEALTH_CHECK_URL}" ]]; then
          echo "🔍 Testing health check endpoint: ${IN_HEALTH_CHECK_URL}"
          timeout_seconds="${IN_HEALTH_CHECK_TIMEOUT}"

          for i in $(seq 1 $((timeout_seconds / 10))); do
            if curl -f -s "${IN_HEALTH_CHECK_URL}" >/dev/null; then
              echo "✅ Health check endpoint is responding"
              echo "health-status=passed" >> $GITHUB_OUTPUT
              break
            else
              echo "⏳ Health check attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi

            if [[ $i -eq $((timeout_seconds / 10)) ]]; then
              echo "❌ Health check endpoint failed after ${timeout_seconds} seconds"
              echo "health-status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
        else
          echo "ℹ️ No health check URL provided, skipping endpoint check"
          echo "health-status=skipped" >> $GITHUB_OUTPUT
        fi

        echo "✅ All health checks passed"

    - name: Disable maintenance mode
      if: inputs.enable-maintenance-mode == 'true' && (success() || failure())
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🚧 Disabling maintenance mode..."
        # Disable maintenance mode (implementation depends on your setup)
        echo "✅ Maintenance mode disabled"

    - name: Run post-deploy commands
      if: inputs.post-deploy-commands != '' && success()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_POST_DEPLOY_COMMANDS: ${{ inputs.post-deploy-commands }}
      run: |
        echo "🔧 Running post-deploy commands..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)
        "${IN_POST_DEPLOY_COMMANDS}"

    - name: Rollback on failure
      id: rollback
      if: failure() && inputs.enable-rollback-on-failure == 'true' && steps.current-deployment.outputs.current-version != 'none'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🔄 Performing automatic rollback with Kamal v1..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Attempt rollback to previous version (v1 syntax may differ)
        if kamal rollback -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}"; then
          echo "✅ Rollback completed successfully"
          echo "rollback-performed=true" >> $GITHUB_OUTPUT

          # Verify rollback
          sleep 10
          kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}"
        else
          echo "❌ Rollback failed or not supported in this version"
          echo "rollback-performed=failed" >> $GITHUB_OUTPUT
        fi

    - name: Set deployment result
      id: deploy-result
      if: always()
      shell: bash
      run: |
        # Determine final status
        deploy_status="${{ steps.kamal-deploy.outputs.deploy-status }}"
        health_status="${{ steps.health-checks.outputs.health-status }}"
        rollback_status="${{ steps.rollback.outputs.rollback-performed }}"

        if [[ "$deploy_status" == "success" && ("$health_status" == "passed" || "$health_status" == "skipped") ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
        elif [[ "$rollback_status" == "true" ]]; then
          echo "status=rolled-back" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

        # Set other outputs
        duration="${{ steps.kamal-deploy.outputs.deploy-duration }}"
        version="${{ steps.kamal-deploy.outputs.deployed-version }}"
        rollback="${{ steps.rollback.outputs.rollback-performed }}"

        echo "duration=${duration:-unknown}" >> $GITHUB_OUTPUT
        echo "version=${version:-unknown}" >> $GITHUB_OUTPUT
        echo "rollback=${rollback:-false}" >> $GITHUB_OUTPUT

    - name: Cleanup
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "🧹 Performing cleanup..."

        # Remove secrets file
        rm -f .kamal/secrets."${IN_ENVIRONMENT}"

        # Clean up Docker resources if deployment failed
        if [[ "${{ steps.deploy-result.outputs.status }}" != "success" ]]; then
          docker system prune -f 2>/dev/null || true
        fi

        echo "✅ Cleanup completed"

branding:
  icon: 'upload-cloud'
  color: 'orange'
