name: 'Kamal v1 Setup'
description: 'Setup and configure Kamal v1 deployment environment with comprehensive validation and best practices'
author: 'WCMC DevOps Team'

inputs:
  environment:
    description: 'Environment to setup (staging, production)'
    required: true
  kamal-version:
    description: 'Kamal version to install'
    required: false
    default: '1.4.0'
  ruby-version:
    description: 'Ruby version to use'
    required: false
    default: '3.2.0'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.3.0'
  buildx-version:
    description: 'Docker Buildx version to use'
    required: false
    default: 'v0.17.1'
  working-directory:
    description: 'Working directory for Rails application'
    required: false
    default: '.'
  dockerfile-path:
    description: 'Path to Dockerfile relative to working directory'
    required: false
    default: 'Dockerfile'
  kamal-config-path:
    description: 'Path to Kamal config file relative to working directory'
    required: false
    default: 'config/deploy.yml'
  database-port:
    description: 'Database port'
    required: false
    default: '5432'
  # Redis Configuration defaults
  redis-host:
    description: 'Redis host'
    required: false
    default: 'host.docker.internal'
  redis-port:
    description: 'Redis port'
    required: false
    default: '6379'
  redis-database:
    description: 'Redis database number for Sidekiq'
    required: false
    default: '1'
  # Project-specific Database Naming
  database-env-prefix:
    description: 'Database environment variable prefix (e.g., OCEAN_CENSUS, TARGET_TRACKER)'
    required: false
    default: 'TARGET_TRACKER'
  # Generic Additional Secrets
  additional-secrets:
    description: 'Additional secrets in KEY=VALUE format, one per line'
    required: false
  pre-setup-commands:
    description: 'Additional commands to run before setup'
    required: false
  post-setup-commands:
    description: 'Additional commands to run after setup'
    required: false
  enable-health-checks:
    description: 'Enable health checks during setup'
    required: false
    default: 'true'

outputs:
  setup-status:
    description: 'Status of the setup operation'
    value: ${{ steps.setup-result.outputs.status }}
  setup-duration:
    description: 'Duration of the setup operation'
    value: ${{ steps.setup-result.outputs.duration }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        IN_DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
        IN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        echo "🔍 Validating inputs for Kamal v1 setup..."

        # Validate environment
        if [[ ! "${IN_ENVIRONMENT}" =~ ^(staging|production)$ ]]; then
          echo "❌ Error: environment must be either 'staging' or 'production'"
          exit 1
        fi

        # Validate working directory exists
        if [[ ! -d "${IN_WORKING_DIRECTORY}" ]]; then
          echo "❌ Error: working-directory '${IN_WORKING_DIRECTORY}' does not exist"
          exit 1
        fi

        # Validate required files
        dockerfile_path="${IN_WORKING_DIRECTORY}/${IN_DOCKERFILE_PATH}"
        kamal_config_path="${IN_WORKING_DIRECTORY}/${IN_KAMAL_CONFIG_PATH}"

        if [[ ! -f "$dockerfile_path" ]]; then
          echo "❌ Error: Dockerfile not found at '$dockerfile_path'"
          exit 1
        fi

        if [[ ! -f "$kamal_config_path" ]]; then
          echo "❌ Error: Kamal config not found at '$kamal_config_path'"
          exit 1
        fi

        echo "✅ Input validation completed for Kamal v1"

    - name: Validate required environment variables
      shell: bash
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "🔧 Validating required environment variables for Kamal v1 setup..."
        
        var_names=(
          "SSH_PRIVATE_KEY"
          "KAMAL_REGISTRY_USERNAME"
          "KAMAL_REGISTRY_PASSWORD"
          "RAILS_MASTER_KEY"
          "RAILS_DEFAULT_PUBLIC_APP_HOST"
          "RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL"
          "DATABASE_HOST"
          "DATABASE_NAME"
          "DATABASE_USERNAME"
          "DATABASE_PASSWORD"
        )

        for var_name in "${var_names[@]}"; do
          if [[ -z "${!var_name}" ]]; then
            echo "❌ Error: ${var_name} is not set or empty"
            echo "Please add this secret to your GitHub environment (${IN_ENVIRONMENT})"
            exit 1
          else
            echo "✅ ${var_name} is set"
          fi
        done

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Yarn
      shell: bash
      run: |
        echo "📦 Installing Yarn..."
        npm install -g yarn
        yarn --version

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: false

    - name: Install PostgreSQL Client Libraries
      shell: bash
      run: |
        echo "🐘 Installing PostgreSQL client libraries..."
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Kamal v1
      shell: bash
      env:
        IN_KAMAL_VERSION: ${{ inputs.kamal-version }}
      run: |
        echo "🚢 Installing Kamal v${IN_KAMAL_VERSION} (Legacy v1)..."
        gem install kamal -v "${IN_KAMAL_VERSION}"
        kamal version

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.SSH_PRIVATE_KEY }}

    - name: Test SSH connectivity
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🔑 Testing SSH connectivity..."
        # Extract hosts from Kamal v1 config
        if command -v yq >/dev/null 2>&1; then
          hosts=$(yq eval '.servers.*[]' "${IN_KAMAL_CONFIG_PATH}" 2>/dev/null || echo "")
        else
          # Fallback to grep if yq is not available
          hosts=$(grep -oP 'servers:.*?(\d+\.\d+\.\d+\.\d+)' "${IN_KAMAL_CONFIG_PATH}" || echo "")
        fi

        if [[ -n "$hosts" ]]; then
          for host in $hosts; do
            echo "Testing connection to $host..."
            ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no $host "echo 'SSH connection successful to $host'" || echo "⚠️ Warning: Could not connect to $host"
          done
        else
          echo "ℹ️ No hosts found in config for SSH testing"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: ${{ inputs.buildx-version }}

    - name: Verify and Configure Buildx
      shell: bash
      run: |
        echo "🐳 Configuring Docker Buildx for Kamal v1..."
        if ! docker buildx version; then
          echo "❌ Error: Buildx not installed correctly"
          exit 1
        fi

        # Create and use buildx instance
        docker buildx create --name kamal-v1-builder --driver docker-container --use 2>/dev/null || docker buildx use kamal-v1-builder
        docker buildx inspect --bootstrap
        echo "✅ Buildx version: $(docker buildx version)"

    - name: Create Kamal v1 secrets file
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ADDITIONAL_SECRETS: ${{ inputs.additional-secrets }}
        IN_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        IN_AWS_REGION: ${{ inputs.aws-region }}
        IN_AWS_S3_ACCESS_KEY_ID: ${{ inputs.aws-s3-access-key-id }}
        IN_AWS_S3_BUCKET_NAME: ${{ inputs.aws-s3-bucket-name }}
        IN_AWS_S3_REGION: ${{ inputs.aws-s3-region }}
        IN_AWS_S3_SECRET_ACCESS_KEY: ${{ inputs.aws-s3-secret-access-key }}
        IN_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        IN_AZURE_AD_CLIENT_ID: ${{ inputs.azure-ad-client-id }}
        IN_AZURE_AD_CLIENT_SECRET: ${{ inputs.azure-ad-client-secret }}
        IN_AZURE_AD_TENANT_ID: ${{ inputs.azure-ad-tenant-id }}
        IN_DATABASE_ENV_PREFIX: ${{ inputs.database-env-prefix }}
        IN_DATABASE_HOST: ${{ inputs.DATABASE_HOST }}
        IN_DATABASE_NAME: ${{ inputs.DATABASE_NAME }}
        IN_DATABASE_PASSWORD: ${{ inputs.DATABASE_PASSWORD }}
        IN_DATABASE_PORT: ${{ inputs.database-port }}
        IN_DATABASE_USERNAME: ${{ inputs.DATABASE_USERNAME }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_FRONTEND_APP_NAME: ${{ inputs.frontend-app-name }}
        IN_KAMAL_REGISTRY_PASSWORD: ${{ inputs.KAMAL_REGISTRY_PASSWORD }}
        IN_KAMAL_REGISTRY_USERNAME: ${{ inputs.KAMAL_REGISTRY_USERNAME }}
        IN_MAIL_PASSWORD: ${{ inputs.mail-password }}
        IN_MAIL_USERNAME: ${{ inputs.mail-username }}
        IN_RAILS_DEFAULT_PUBLIC_APP_HOST: ${{ inputs.RAILS_DEFAULT_PUBLIC_APP_HOST }}
        IN_RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL: ${{ inputs.RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL }}
        IN_RAILS_MASTER_KEY: ${{ inputs.RAILS_MASTER_KEY }}
        IN_REDIS_DATABASE: ${{ inputs.redis-database }}
        IN_REDIS_HOST: ${{ inputs.redis-host }}
        IN_REDIS_PASSWORD: ${{ inputs.redis-password }}
        IN_REDIS_PORT: ${{ inputs.redis-port }}
        IN_REDIS_USERNAME: ${{ inputs.redis-username }}
        IN_WCMC_USER_MANAGEMENT_SECRET: ${{ inputs.wcmc-user-management-secret }}
      run: |
        echo "🔐 Creating Kamal v1 secrets file..."
        mkdir -p .kamal
        secrets_file=".kamal/secrets.${IN_ENVIRONMENT}"

        # Create secrets file with proper permissions
        touch "$secrets_file"
        chmod 600 "$secrets_file"

        # Base secrets (v1 format)
        cat <<EOF > "$secrets_file"
        KAMAL_REGISTRY_USERNAME=${IN_KAMAL_REGISTRY_USERNAME}
        KAMAL_REGISTRY_PASSWORD=${IN_KAMAL_REGISTRY_PASSWORD}
        RAILS_MASTER_KEY=${IN_RAILS_MASTER_KEY}
        RAILS_DEFAULT_PUBLIC_APP_HOST=${IN_RAILS_DEFAULT_PUBLIC_APP_HOST}
        RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL=${IN_RAILS_DEFAULT_PUBLIC_APP_HOST_PROTOCOL}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_HOSTNAME=${IN_DATABASE_HOST}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_NAME=${IN_DATABASE_NAME}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_USERNAME=${IN_DATABASE_USERNAME}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_PASSWORD=${IN_DATABASE_PASSWORD}
        ${IN_DATABASE_ENV_PREFIX}_DATABASE_PORT=${IN_DATABASE_PORT}
        EOF

        # Add Redis configuration if provided
        if [[ -n "${IN_REDIS_USERNAME}" && -n "${IN_REDIS_PASSWORD}" ]]; then
          echo "REDIS_USERNAME=${IN_REDIS_USERNAME}" >> "$secrets_file"
          echo "REDIS_PASSWORD=${IN_REDIS_PASSWORD}" >> "$secrets_file"
          echo "SIDEKIQ_REDIS_URL=redis://${IN_REDIS_USERNAME}:${IN_REDIS_PASSWORD}@${IN_REDIS_HOST}:${IN_REDIS_PORT}/${IN_REDIS_DATABASE}" >> "$secrets_file"
          echo "✅ Added Redis configuration with Sidekiq URL"
        fi

        # Add Mail configuration if provided
        if [[ -n "${IN_MAIL_USERNAME}" && -n "${IN_MAIL_PASSWORD}" ]]; then
          echo "MAIL_USERNAME=${IN_MAIL_USERNAME}" >> "$secrets_file"
          echo "MAIL_PASSWORD=${IN_MAIL_PASSWORD}" >> "$secrets_file"
          echo "✅ Added Mail server configuration"
        fi

        # Add AWS general secrets if provided
        if [[ -n "${IN_AWS_ACCESS_KEY_ID}" ]]; then
          echo "AWS_ACCESS_KEY_ID=${IN_AWS_ACCESS_KEY_ID}" >> "$secrets_file"
          echo "AWS_SECRET_ACCESS_KEY=${IN_AWS_SECRET_ACCESS_KEY}" >> "$secrets_file"
          echo "AWS_REGION=${IN_AWS_REGION}" >> "$secrets_file"
          echo "✅ Added AWS general configuration"
        fi

        # Add AWS S3 specific secrets if provided
        if [[ -n "${IN_AWS_S3_ACCESS_KEY_ID}" ]]; then
          echo "AWS_S3_ACCESS_KEY_ID=${IN_AWS_S3_ACCESS_KEY_ID}" >> "$secrets_file"
          echo "AWS_S3_SECRET_ACCESS_KEY=${IN_AWS_S3_SECRET_ACCESS_KEY}" >> "$secrets_file"
          echo "AWS_S3_REGION=${IN_AWS_S3_REGION}" >> "$secrets_file"
          echo "AWS_S3_NAME=${IN_AWS_S3_BUCKET_NAME}" >> "$secrets_file"
          echo "✅ Added AWS S3 configuration"
        fi

        # Add Frontend Integration if provided
        if [[ -n "${IN_FRONTEND_APP_NAME}" ]]; then
          echo "FRONTEND_APP_NAME=${IN_FRONTEND_APP_NAME}" >> "$secrets_file"
          echo "✅ Added Frontend integration configuration"
        fi

        # Add Azure AD configuration if provided
        if [[ -n "${IN_AZURE_AD_CLIENT_ID}" ]]; then
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_CLIENT_ID=${IN_AZURE_AD_CLIENT_ID}" >> "$secrets_file"
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_CLIENT_SECRET=${IN_AZURE_AD_CLIENT_SECRET}" >> "$secrets_file"
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_AZURE_AD_TENANT_ID=${IN_AZURE_AD_TENANT_ID}" >> "$secrets_file"
          echo "✅ Added Azure AD configuration for WCMC User Management"
        fi

        # Add WCMC User Management configuration if provided
        if [[ -n "${IN_WCMC_USER_MANAGEMENT_SECRET}" ]]; then
          echo "NUXT_WCMC_MODULES_WCMC_USER_MANAGEMENT_SECRET=${IN_WCMC_USER_MANAGEMENT_SECRET}" >> "$secrets_file"
          echo "✅ Added WCMC User Management configuration"
        fi

        # Add additional secrets if provided
        if [[ -n "${IN_ADDITIONAL_SECRETS}" ]]; then
          echo "" >> "$secrets_file"
          echo "# Additional project-specific secrets" >> "$secrets_file"
          echo "${IN_ADDITIONAL_SECRETS}" >> "$secrets_file"
          echo "✅ Added additional project-specific secrets"
        fi

        echo "✅ Kamal v1 secrets file created with $(wc -l < "$secrets_file") entries"

    - name: Run pre-setup commands
      if: inputs.pre-setup-commands != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_PRE_SETUP_COMMANDS: ${{ inputs.pre-setup-commands }}
      run: |
        echo "🔧 Running pre-setup commands..."
        "${IN_PRE_SETUP_COMMANDS}"

    - name: Validate Kamal v1 configuration
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "✅ Validating Kamal v1 configuration..."
        # Load secrets
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Validate config (v1 syntax)
        kamal config validate -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}" || echo "⚠️ Config validation may not be available in Kamal v1"

    - name: Run Kamal v1 setup
      id: kamal-setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🚀 Starting Kamal v1 setup for ${IN_ENVIRONMENT}..."
        start_time=$(date +%s)

        # Load secrets
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Run setup with verbose output (v1 syntax)
        if kamal setup --verbose -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}"; then
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "setup-duration=${duration}" >> $GITHUB_OUTPUT
          echo "setup-status=success" >> $GITHUB_OUTPUT
          echo "✅ Kamal v1 setup completed successfully in ${duration} seconds"
        else
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "setup-duration=${duration}" >> $GITHUB_OUTPUT
          echo "setup-status=failed" >> $GITHUB_OUTPUT
          echo "❌ Kamal v1 setup failed after ${duration} seconds"
          exit 1
        fi

    - name: Run health checks
      if: inputs.enable-health-checks == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_KAMAL_CONFIG_PATH: ${{ inputs.kamal-config-path }}
      run: |
        echo "🏥 Running health checks..."
        export $(grep -v '^#' .kamal/secrets."${IN_ENVIRONMENT}" | xargs)

        # Check if containers are running (v1 syntax)
        kamal ps -c "${IN_KAMAL_CONFIG_PATH}" -d "${IN_ENVIRONMENT}" || echo "⚠️ PS command may differ in Kamal v1"

    - name: Run post-setup commands
      if: inputs.post-setup-commands != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_POST_SETUP_COMMANDS: ${{ inputs.post-setup-commands }}
      run: |
        echo "🔧 Running post-setup commands..."
        "${IN_POST_SETUP_COMMANDS}"

    - name: Set setup result
      id: setup-result
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.kamal-setup.outcome }}" == "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

        # Get duration from setup step or calculate fallback
        duration="${{ steps.kamal-setup.outputs.setup-duration }}"
        if [[ -z "$duration" ]]; then
          duration="unknown"
        fi
        echo "duration=${duration}" >> $GITHUB_OUTPUT

    - name: Cleanup on failure
      if: failure()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        echo "🧹 Cleaning up after failure..."
        # Remove secrets file
        rm -f .kamal/secrets."${IN_ENVIRONMENT}"

        # Clean up Docker resources
        docker system prune -f || true

        echo "✅ Cleanup completed"

branding:
  icon: 'settings'
  color: 'orange'
