name: 'Validate and Populate Secrets'
description: 'Validates secrets-common file and populates environment variables'

inputs:
  secrets-file:
    description: 'Path to the secrets-common file'
    required: true
    default: '.kamal/secrets-common'
  environment:
    description: 'Environment to validate against'
    required: true
    default: 'staging'

runs:
  using: "composite"
  steps:
    - name: Check if secrets-common exists
      shell: bash
      env:
        IN_SECRETS_FILE: ${{ inputs.secrets-file }}
      run: |
        if [ ! -f "${IN_SECRETS_FILE}" ]; then
          echo "::error::Secrets file not found at ${IN_SECRETS_FILE}"
          echo "Please create the secrets file by copying the template:"
          echo "cp .kamal/secrets-common.template ${IN_SECRETS_FILE}"
          exit 1
        fi

    - name: Extract required variables
      id: extract-vars
      shell: bash
      env:
        IN_SECRETS_FILE: ${{ inputs.secrets-file }}
      run: |
        # Extract the environment variables this secrets file depends on.
        #
        # Entries look like NAME=$SOURCE. NAME is what Kamal exposes to the
        # container; $SOURCE is the variable that must exist in the environment.
        # Usually they match, but they do not have to:
        #
        #   RAILS_MASTER_KEY=$RAILS_MASTER_KEY     -> needs RAILS_MASTER_KEY
        #   MYSQL_PASSWORD=$WORDPRESS_DB_PASSWORD  -> needs WORDPRESS_DB_PASSWORD
        #
        # Reading the left-hand side would demand a MYSQL_PASSWORD secret that is
        # not supposed to exist, so read the referenced variable instead.
        # Lines with a literal value (no $) need nothing from the environment.
        #
        # A file may legitimately require nothing at all - target-tracker's
        # nuxt/.kamal/secrets-common is entirely comments. Composite steps run
        # under `-e -o pipefail`, so a grep matching nothing would abort the
        # step; `|| true` keeps an empty result a valid answer.
        REQUIRED_VARS=$(
          {
            tr -d '\r' < "${IN_SECRETS_FILE}" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' | grep '=' \
            | sed -e 's/^[^=]*=//' \
            | grep '^\$' \
            | grep -v '^\$(' \
            | sed -e 's/^\${\([A-Za-z_][A-Za-z0-9_]*\).*/\1/' -e 's/^\$\([A-Za-z_][A-Za-z0-9_]*\).*/\1/' \
            | sort -u
          } || true
        )

        if [ -z "${REQUIRED_VARS}" ]; then
          echo "ℹ️  ${IN_SECRETS_FILE} references no environment variables - nothing to validate"
        fi

        echo "required_vars<<EOF" >> $GITHUB_OUTPUT
        echo "$REQUIRED_VARS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Validate environment variables
      id: validate-vars
      shell: bash
      env:
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_SECRETS_FILE: ${{ inputs.secrets-file }}
        # Step outputs are substituted as text into the script just like inputs
        # are, so this is read from the environment rather than interpolated.
        REQUIRED_VARS: ${{ steps.extract-vars.outputs.required_vars }}
      run: |
        # Read required variables from previous step
        while IFS= read -r var; do
          if [ -z "$var" ]; then
            continue
          fi

          # Check if the variable is set in GitHub secrets
          if [ -z "${!var}" ]; then
            echo "::error::Missing required secret: $var"
            echo "Please add this secret to your GitHub environment (${IN_ENVIRONMENT})"
            echo "You can find the required format in ${IN_SECRETS_FILE}"
            MISSING_VARS=true
          fi
        done <<< "${REQUIRED_VARS}"
        
        if [ "$MISSING_VARS" = true ]; then
          exit 1
        fi

    - name: Populate environment variables
      shell: bash
      env:
        REQUIRED_VARS: ${{ steps.extract-vars.outputs.required_vars }}
      run: |
        # Instead of sourcing the template file, we'll export the existing environment variables
        # The secrets are already available as environment variables from the workflow

        echo "✅ All required secrets are validated and available as environment variables"
        echo "The following variables have been validated:"

        while IFS= read -r var; do
          if [ -z "$var" ]; then
            continue
          fi
          if [ -n "${!var}" ]; then
            echo "  ✅ $var is set"
          fi
        done <<< "${REQUIRED_VARS}" 